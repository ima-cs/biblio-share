server.port=8083
spring.datasource.url=jdbc:h2:mem:pretdb
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.circuitbreaker.configs.default.sliding-window-size=6
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogue.base-config=default
resilience4j.circuitbreaker.instances.adherents.base-config=default
resilience4j.retry.instances.catalogue.base-config=default
resilience4j.retry.instances.adherents.base-config=default

resilience4j.retry.configs.default.retry-exceptions=com.biblioshare.pret.client.RemoteUnavailable
resilience4j.bulkhead.instances.catalogue.max-concurrent-calls=10
resilience4j.bulkhead.instances.catalogue.max-wait-duration=0ms
resilience4j.bulkhead.instances.adherents.max-concurrent-calls=10
resilience4j.bulkhead.instances.adherents.max-wait-duration=0ms
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms
